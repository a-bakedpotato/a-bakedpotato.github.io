<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Natlan Outcrops</title>
  <link rel="stylesheet" type="text/css" href="https://a-bakedpotato.github.io/assets/style/index.css">
  <link href='https://fonts.googleapis.com/css?family=Lato&subset=latin,latin-ext' rel='stylesheet' type='text/css'>
  <style>
    img {
      width: 90%;
      padding: 0;
      margin: 0;
      border: 0;
      line-height: 0;
      float: start;
      user-select: none;
    }
    #map {
      line-height: 0;
      text-align: center;
      position: relative;
    }
    .border {
      width: 3%;
      border-radius: 50%;
      position: absolute;
      z-index: 1;
      filter: drop-shadow(0px 0px 10px black);
      background: lime center;
    }
    .border.g1 {
      background: #889683 center;
    }
    .border.g2 {
      background: #85a27c center;
    }
    .border.g3 {
      background: #82ad74 center;
    }
    .border.g4 {
      background: #7cb96c center;
    }
    .border.g5 {
      background: #76c562 center;
    }
    .border.g6 {
      background: #6dd058 center;
    }
    .border.g7 {
      background: #62dc4d center;
    }
    .border.g8 {
      background: #53e83e center;
    }
    .border.g9 {
      background: #3cf32b center;
    }
    .border.rng {
      background: yellow center;
    }
    .border.no {
      background: red center;
    }
    .border.no1 {
      background: #9c847e center;
    }
    .border.no2 {
      background: #ab7d71 center;
    }
    .border.no3 {
      background: #b87665 center;
    }
    .border.no4 {
      background: #c46e59 center;
    }
    .border.no5 {
      background: #d0654c center;
    }
    .border.no6 {
      background: #da5b40 center;
    }
    .border.no7 {
      background: #e45033 center;
    }
    .border.no8 {
      background: #ed4126 center;
    }
    .border.no9 {
      background: #f62e16 center;
    }
    .border.unk {
      background: #8a8a8a center;
    }
    .border:hover {
      transition: .1s;
      transform: scale(135%);
      z-index: 100;
    }
    a {
      text-decoration: none;
      transition: 0.2s;
    }

    a:hover {
      cursor: default;
      font-size: 2vh;
    }

    p {
      font-size: 2.5vw;
    }
  </style>
</head>
<body>
<h1>Mining Outcrops Arrangement 1</h1>
<div id="map">
	<img src="../map/natlan.png">
	
	<!-- top right -->
	<a><img src="../leyline/crystal.png" class="border unk" style="left:81.5%; top:40.5%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:78.0%; top:38.0%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:78.2%; top:43.0%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:79.2%; top:44.0%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:74.5%; top:37.8%"></a>
	
	<!-- left -->
	<a><img src="../leyline/crystal.png" class="border unk" style="left:52.5%; top:45.0%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:52.8%; top:43.0%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:54.0%; top:41.0%"></a>
	
	<!-- top left -->
	<a><img src="../leyline/crystal.png" class="border unk" style="left:57.5%; top:33.0%"></a>
	
	<!-- mualani -->
	<a><img src="../leyline/crystal.png" class="border unk" style="left:73.0%; top:63.0%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:71.0%; top:63.2%"></a>
	<a><img src="../leyline/crystal.png" class="border unk" style="left:70.0%; top:60.0%"></a>
	
	<!-- summer island -->
	<a><img src="../leyline/crystal.png" class="border unk" style="left:29.0%; top:25.0%"></a>
</div>
<p><img src="../leyline/crystal.png" class="border" style="transform: translateX(-100%)">&nbsp;&nbsp;Guaranteed Spawn</p>
<p><img src="../leyline/crystal.png" class="border rng" style="transform: translateX(-100%)">&nbsp;&nbsp;Random Spawn</p>
<p><img src="../leyline/crystal.png" class="border no" style="transform: translateX(-100%)">&nbsp;&nbsp;Not Spawned</p>
<p>If any of this data misaligns with yours, please contact me on discord.</p>

</body>
</html>
